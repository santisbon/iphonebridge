[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iphonebridge"
version = "0.12.0"
description = "Bluetooth bridge from iPhone to Linux desktop — SMS + notifications + contacts"
authors = [{name = "Gabe Shatunovsky", email = "gabriel@shatunovsky.com"}]
maintainers = [{name = "santisbon"}]
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "typer>=0.12",
  # NOTE: dbus-python and PyGObject are installed via apt
  # (python3-dbus, python3-gi) and intentionally NOT pulled from PyPI —
  # the PyPI versions are notoriously fragile to build. The venv that
  # runs this package should be created by the system interpreter
  # (/usr/bin/python3, not conda/pyenv) with --system-site-packages —
  # that flag inherits the creating interpreter's packages, and only the
  # system one can see apt's dist-packages.
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.5",
]

[project.scripts]
iphonebridge = "iphonebridge.cli:app"

[project.gui-scripts]
iphonebridge-ui = "iphonebridge.ui.qtapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The QML is the whole of the UI's non-Python surface. Miss it and the
# app installs but cannot draw anything.
"iphonebridge.ui" = ["qml/*.qml"]

[tool.pytest.ini_options]
# Without this, a bare `pytest` from the repo root recurses the whole tree
# (src/, spike/, .venv probing, …) during collection and can hang. Scope
# collection to the test suite — matches what CI runs.
testpaths = ["tests"]
filterwarnings = [
  # PyGObject emits this from its own GLib overrides the moment
  # gi.repository.GLib is imported — nothing in this project calls
  # unix_signal_add, so there is nothing here to fix. Matched by message
  # rather than by module so a real deprecation from our own code is
  # still reported.
  "ignore:GLib\\.unix_signal_add.*is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
  "B904",   # `raise ... from err` not enforced — too pedantic for this size of project
  "RUF005", # iterable unpacking vs `+` — readability is a wash here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # tests can have long lines for readability of bMessage fixtures
